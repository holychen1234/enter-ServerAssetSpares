# ============================================================
# 主机资产管理平台 — Docker Compose 部署
# ============================================================
# 前置条件: Docker 24+、docker compose v2
#
# 快速启动:
#   make up          # 构建前端并启动全部服务
#   make down        # 停止服务
#   make logs        # 查看日志
#
# 手动:
#   pnpm run build:prod            # 先本地构建前端
#   docker compose up -d           # 启动全部服务
# ============================================================

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cmdb}
      MYSQL_USER: ${MYSQL_USER:-cmdb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cmdb123}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./reference-backend/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${MYSQL_PASSWORD:-cmdb123}",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./reference-backend
      dockerfile: Dockerfile
    image: reference-backend-api:latest
    restart: unless-stopped
    env_file: reference-backend/.env
    environment:
      AI_API_KEY: ${AI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  # MCP SSE server — 供外部 Agent 平台（Dify / LangChain / 自定义）通过 HTTP SSE 调用 CMDB 工具
  mcp:
    image: reference-backend-api:latest
    restart: unless-stopped
    env_file: reference-backend/.env
    command: ["python3", "-m", "app.mcp_server", "--sse", "--host", "0.0.0.0", "--port", "8100"]
    ports:
      - "${MCP_SSE_PORT:-8100}:8100"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./reference-backend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # Redfish Mock — 仅开发/演示需要，生产环境无需启动。
  # 启动方式: docker compose --profile mock up -d redfish-mock
  redfish-mock:
    image: dmtf/redfish-mockup-server:latest
    restart: unless-stopped
    profiles: [mock]

volumes:
  mysql-data:
