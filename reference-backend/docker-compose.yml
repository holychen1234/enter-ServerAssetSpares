# Full-stack on-prem deployment.
# - mysql:        only reachable inside the docker network
# - api:          FastAPI, only reachable inside the docker network
# - web:          Nginx serving SPA + reverse-proxying /api → api:8000
# - redfish-mock: DMTF Redfish mockup server, used as the default BMC endpoint
#
# Usage:
#   cp .env.example .env
#   docker compose up -d --build

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # Force server + client default charset to utf8mb4 so init scripts,
    # CLI sessions and the FastAPI driver all agree. Without this the
    # MySQL 8 client defaults to utf8mb4 but legacy tooling can still
    # negotiate latin1, producing mojibake like "ç³»ç»Ÿç®¡ç¿".
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cmdb}
      MYSQL_USER: ${MYSQL_USER:-cmdb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cmdb123}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-cmdb123}"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy

  # MCP SSE server — 供外部 Agent 平台通过 HTTP SSE 调用 CMDB 查询工具
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    command: ["python3", "-m", "app.mcp_server", "--sse", "--host", "0.0.0.0", "--port", "8100"]
    ports:
      - "${MCP_SSE_PORT:-8100}:8100"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: reference-backend/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

  # Redfish Mock — 仅开发/演示需要，生产环境无需启动。
  # 启动方式: docker compose --profile mock up -d redfish-mock
  redfish-mock:
    image: dmtf/redfish-mockup-server:latest
    restart: unless-stopped
    profiles: [mock]
    # Internal only — the api container reaches it via http://redfish-mock:8000

volumes:
  mysql-data:
